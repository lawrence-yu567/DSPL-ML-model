DATASET:
    NAME: euclid_like_single_lenses
    PARAMETERS:
        SIZE: 10000
        OUTDIR: dl_datasets
    SEED: 100

COSMOLOGY:
    PARAMETERS:
        H0: 70
        Om0: 0.3

IMAGE:
    PARAMETERS:
        exposure_time: 565
        numPix: 96
        pixel_scale: 0.1
        psf_type: 'GAUSSIAN'
        read_noise: 4.5
        ccd_gain: 3.1

SURVEY:
    PARAMETERS:
        BANDS: I_E
        seeing: 0.16
        magnitude_zero_point: 25.1
        sky_brightness: 22.35
        num_exposures: 4

DISTRIBUTIONS:
    USERDIST_1:
        FILENAME: physical_lens_table.txt
        MODE: sample
        PARAMS:
            - PLANE_1-OBJECT_1-REDSHIFT                       # z
            - PLANE_2-OBJECT_1-REDSHIFT                       # z_source
            - PLANE_1-OBJECT_1-MASS_PROFILE_1-theta_E         # theta_E
            - PLANE_1-OBJECT_1-MASS_PROFILE_1-e1              # e1
            - PLANE_1-OBJECT_1-MASS_PROFILE_1-e2              # e2
            - PLANE_2-OBJECT_1-MASS_PROFILE_1-theta_E         # theta_E_source
            - PLANE_2-OBJECT_1-MASS_PROFILE_1-e1              # e1_source
            - PLANE_2-OBJECT_1-MASS_PROFILE_1-e2              # e2_source
            - WEIGHT


SPECIES:
    GALAXY_1:
        NAME: LENS
        LIGHT_PROFILE_1:
            NAME: SERSIC_ELLIPSE
            PARAMETERS:
                magnitude: 16
                center_x: 0.0
                center_y: 0.0
                R_sersic: 2
                n_sersic: 2
                e1: 0.1
                e2: 0.1
        MASS_PROFILE_1:
            NAME: SIE
            PARAMETERS:
                theta_E: 3.0      # placeholder, overwritten by USERDIST_1
                e1: 0.0           # placeholder, overwritten by USERDIST_1
                e2: 0.0           # placeholder, overwritten by USERDIST_1
                center_x: 0.0
                center_y: 0.0


    GALAXY_2:
        NAME: SOURCE_1
        LIGHT_PROFILE_1:
            NAME: SERSIC_ELLIPSE
            PARAMETERS:
                magnitude: 16
                center_x: 0.2
                center_y: -0.2
                R_sersic: 1.5
                n_sersic: 1
                e1: 0.15
                e2: -0.15
                
        MASS_PROFILE_1:
            NAME: SIE
            PARAMETERS:
                theta_E: 0.2      # placeholder, overwritten by USERDIST_1
                e1: 0.0           # placeholder, overwritten by USERDIST_1
                e2: 0.0           # placeholder, overwritten by USERDIST_1
                center_x: 0.0
                center_y: 0.0

GEOMETRY:
    CONFIGURATION_1:
        NAME: GALAXY_GALAXY
        FRACTION: 1.0
        PLANE_1:
            OBJECT_1: LENS
            PARAMETERS:
                REDSHIFT: 0.5    # placeholder, overwritten by USERDIST_1
        PLANE_2:
            OBJECT_1: SOURCE_1
            PARAMETERS:
                REDSHIFT: 1.5    # placeholder, overwritten by USERDIST_1